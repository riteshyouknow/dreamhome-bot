<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DreamHome Properties</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(99,102,241,0.3) 0%, transparent 70%);
            top: -100px; left: -100px;
            animation: blob1 8s infinite ease-in-out;
            pointer-events: none;
        }
        body::after {
            content: '';
            position: fixed;
            width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(236,72,153,0.2) 0%, transparent 70%);
            bottom: -80px; right: -80px;
            animation: blob2 10s infinite ease-in-out;
            pointer-events: none;
        }
        @keyframes blob1 {
            0%,100% { transform: translate(0,0) scale(1); }
            50% { transform: translate(60px,40px) scale(1.1); }
        }
        @keyframes blob2 {
            0%,100% { transform: translate(0,0) scale(1); }
            50% { transform: translate(-40px,-30px) scale(1.15); }
        }

        .glass {
            background: rgba(255,255,255,0.07);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 24px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.4);
        }

        /* ── Language Screen ── */
        .language-screen {
            width: min(380px, 92vw);
            padding: 44px 36px 40px;
            text-align: center;
            animation: fadeUp 0.6s ease both;
        }
        .logo-icon { font-size: 42px; margin-bottom: 12px; display: block; }
        .language-screen h2 {
            font-family: 'Playfair Display', serif;
            color: #fff; font-size: 24px; margin-bottom: 6px;
        }
        .language-screen .subtitle {
            color: rgba(255,255,255,0.5);
            font-size: 13px; margin-bottom: 32px; line-height: 1.6;
        }
        .lang-chips {
            display: flex; gap: 10px;
            justify-content: center; flex-wrap: wrap;
        }
        .lang-chip {
            padding: 9px 20px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50px;
            background: rgba(255,255,255,0.08);
            color: rgba(255,255,255,0.85);
            font-family: 'DM Sans', sans-serif;
            font-size: 13px; font-weight: 500;
            cursor: pointer;
            transition: all 0.25s ease;
            white-space: nowrap;
        }
        .lang-chip:hover, .lang-chip:active {
            background: rgba(99,102,241,0.5);
            border-color: rgba(99,102,241,0.8);
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(99,102,241,0.3);
        }
        .divider {
            margin: 28px 0 20px;
            display: flex; align-items: center; gap: 12px;
            color: rgba(255,255,255,0.25);
            font-size: 11px; letter-spacing: 1px; text-transform: uppercase;
        }
        .divider::before, .divider::after {
            content: ''; flex: 1; height: 1px;
            background: rgba(255,255,255,0.1);
        }

        /* ── Chat Screen ── */
        .chat-container {
            width: min(400px, 100vw);
            height: 100vh;
            height: 100dvh;
            display: none;
            flex-direction: column;
            animation: fadeUp 0.5s ease both;
            overflow: hidden;
        }

        /* On larger screens, fixed card size */
        @media (min-width: 480px) {
            .chat-container {
                width: 390px;
                height: 660px;
                border-radius: 24px;
            }
        }

        /* On mobile, full screen */
        @media (max-width: 479px) {
            .chat-container {
                border-radius: 0;
                width: 100vw;
            }
            .glass.chat-container {
                border-radius: 0;
                border-left: none;
                border-right: none;
            }
        }

        .chat-header {
            padding: 16px 18px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            display: flex; align-items: center; gap: 12px;
            flex-shrink: 0;
        }
        .avatar {
            width: 40px; height: 40px; border-radius: 50%;
            background: linear-gradient(135deg, #6366f1, #ec4899);
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; flex-shrink: 0;
        }
        .header-info { flex: 1; min-width: 0; }
        .header-info h3 {
            font-family: 'Playfair Display', serif;
            color: #fff; font-size: 14px; font-weight: 600;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .header-info .status {
            display: flex; align-items: center; gap: 5px;
            font-size: 11px; color: rgba(255,255,255,0.5); margin-top: 2px;
        }
        .status-dot {
            width: 6px; height: 6px;
            background: #4ade80; border-radius: 50%;
            animation: pulse 2s infinite; flex-shrink: 0;
        }
        @keyframes pulse {
            0%,100% { opacity: 1; } 50% { opacity: 0.4; }
        }
        .lang-badge {
            background: rgba(99,102,241,0.3);
            border: 1px solid rgba(99,102,241,0.4);
            color: rgba(255,255,255,0.8);
            padding: 3px 10px; border-radius: 20px;
            font-size: 10px; font-weight: 500;
            white-space: nowrap; flex-shrink: 0;
        }

        .messages {
            flex: 1; overflow-y: auto;
            padding: 16px 14px;
            display: flex; flex-direction: column; gap: 10px;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.1) transparent;
            -webkit-overflow-scrolling: touch;
        }
        .messages::-webkit-scrollbar { width: 3px; }
        .messages::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.1); border-radius: 4px;
        }

        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.5;
            animation: msgIn 0.3s ease both;
            word-wrap: break-word;
            white-space: pre-wrap;
        }
        @keyframes msgIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .bot {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.08);
            color: rgba(255,255,255,0.9);
            align-self: flex-start;
            border-bottom-left-radius: 5px;
        }
        .user {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #fff; align-self: flex-end;
            border-bottom-right-radius: 5px;
            box-shadow: 0 4px 15px rgba(99,102,241,0.35);
        }
        .typing {
            align-self: flex-start;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.08);
            padding: 12px 16px; border-radius: 18px;
            border-bottom-left-radius: 5px;
            display: flex; gap: 4px; align-items: center;
        }
        .typing span {
            width: 6px; height: 6px;
            background: rgba(255,255,255,0.5);
            border-radius: 50%; animation: bounce 1.2s infinite;
        }
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            0%,60%,100% { transform: translateY(0); }
            30% { transform: translateY(-5px); }
        }

        .input-area {
            padding: 12px 14px;
            padding-bottom: max(12px, env(safe-area-inset-bottom));
            border-top: 1px solid rgba(255,255,255,0.08);
            display: flex; gap: 10px; align-items: center;
            flex-shrink: 0;
        }
        .input-area input {
            flex: 1; padding: 11px 16px;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 50px; color: #fff;
            font-family: 'DM Sans', sans-serif;
            font-size: 14px; outline: none;
            transition: border-color 0.2s;
            min-width: 0;
        }
        .input-area input::placeholder { color: rgba(255,255,255,0.3); }
        .input-area input:focus { border-color: rgba(99,102,241,0.6); }
        .send-btn {
            width: 42px; height: 42px; border-radius: 50%;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border: none; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(99,102,241,0.4);
            -webkit-tap-highlight-color: transparent;
        }
        .send-btn:hover { transform: scale(1.08); }
        .send-btn:active { transform: scale(0.95); }
        .send-btn svg { width: 16px; height: 16px; fill: white; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<!-- Language Selection Screen -->
<div class="glass language-screen" id="languageScreen">
    <span class="logo-icon">🏠</span>
    <h2>DreamHome Properties</h2>
    <p class="subtitle">Your AI-powered property assistant<br>अपनी भाषा चुनें</p>
    <div class="divider">Choose Language</div>
    <div class="lang-chips">
        <button class="lang-chip" onclick="selectLanguage('Hindi')">🇮🇳 हिंदी</button>
        <button class="lang-chip" onclick="selectLanguage('English')">🇬🇧 English</button>
        <button class="lang-chip" onclick="selectLanguage('Hinglish')">🔀 Hinglish</button>
    </div>
</div>

<!-- Chat Screen -->
<div class="glass chat-container" id="chatContainer">
    <div class="chat-header">
        <div class="avatar">🏠</div>
        <div class="header-info">
            <h3>DreamHome Properties</h3>
            <div class="status">
                <div class="status-dot"></div>
                AI Assistant • Online
            </div>
        </div>
        <span class="lang-badge" id="langBadge"></span>
    </div>

    <div class="messages" id="messages"></div>

    <div class="input-area">
        <input type="text" id="userInput"
               placeholder="Type your message..."
               onkeypress="handleKey(event)"/>
        <button class="send-btn" onclick="sendMessage()">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/>
            </svg>
        </button>
    </div>
</div>

<script>
    const sessionId = 'user_' + Date.now();
    const messagesDiv = document.getElementById('messages');
    const input = document.getElementById('userInput');

    function selectLanguage(lang) {
        document.getElementById('languageScreen').style.display = 'none';
        document.getElementById('chatContainer').style.display = 'flex';
        document.getElementById('langBadge').innerText = lang;
        sendFirstMessage(`LANGUAGE: ${lang}. Hello, I want to find a property.`);
    }

    async function sendFirstMessage(msg) {
        showTyping();
        try {
            const res = await fetch('http://localhost:8000/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ session_id: sessionId, message: msg })
            });
            const data = await res.json();
            removeTyping();
            addMessage(data.reply, 'bot');
        } catch (err) {
            removeTyping();
            addMessage('Connection error. Please check server!', 'bot');
        }
    }

    function handleKey(e) {
        if (e.key === 'Enter') sendMessage();
    }

    function addMessage(text, type) {
        const div = document.createElement('div');
        div.className = `message ${type}`;
        // Remove markdown bold/italic
        const clean = text
            .replace(/\*\*(.*?)\*\*/g, '$1')
            .replace(/\*(.*?)\*/g, '$1')
            .replace(/_(.*?)_/g, '$1');
        div.innerText = clean;
        messagesDiv.appendChild(div);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function showTyping() {
        const t = document.createElement('div');
        t.className = 'typing'; t.id = 'typing';
        t.innerHTML = '<span></span><span></span><span></span>';
        messagesDiv.appendChild(t);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function removeTyping() {
        const t = document.getElementById('typing');
        if (t) t.remove();
    }

    async function sendMessage() {
        const msg = input.value.trim();
        if (!msg) return;
        addMessage(msg, 'user');
        input.value = '';
        showTyping();
        try {
            const res = await fetch('http://localhost:8000/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ session_id: sessionId, message: msg })
            });
            const data = await res.json();
            removeTyping();
            addMessage(data.reply, 'bot');
        } catch (err) {
            removeTyping();
            addMessage('Connection error. Please check server!', 'bot');
        }
    }
</script>
</body>
</html>
